<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple Collector</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: VT323 for VHS OSD and Outfit for clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'VT323', monospace;
      overflow: hidden;
      background-color: #050505;
      color: #fff;
    }

    /* --- VHS Aesthetic Overlay CSS --- */
    .vhs-font {
      font-family: 'VT323', monospace;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
      letter-spacing: 2px;
    }

    /* Scanline effect */
    .vhs-scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
    }

    /* Vignette dark edges */
    .vhs-vignette {
      background: radial-gradient(
        circle, 
        rgba(0,0,0,0) 60%, 
        rgba(0,0,0,0.7) 95%, 
        rgba(0,0,0,0.95) 100%
      );
    }

    /* Chromatic RGB shift effect on canvas wrapper */
    @keyframes rgbShift {
      0% { transform: translate(0, 0); filter: drop-shadow(1px 0 0 rgba(255,0,0,0.4)) drop-shadow(-1px 0 0 rgba(0,255,255,0.4)); }
      50% { transform: translate(-0.5px, 0.5px); filter: drop-shadow(1.5px 0 0 rgba(255,0,0,0.5)) drop-shadow(-1.5px 0 0 rgba(0,255,255,0.5)); }
      100% { transform: translate(0, 0); filter: drop-shadow(1px 0 0 rgba(255,0,0,0.4)) drop-shadow(-1px 0 0 rgba(0,255,255,0.4)); }
    }
    .vhs-rgb-glitch {
      animation: rgbShift 0.15s infinite;
    }

    /* VHS Tracking artifact bar */
    @keyframes vhsTracking {
      0% { top: -10%; opacity: 0; }
      10% { opacity: 0.3; }
      20% { opacity: 0.6; }
      30% { opacity: 0.1; }
      100% { top: 110%; opacity: 0; }
    }
    .vhs-tracking-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 18px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.18), transparent);
      backdrop-filter: blur(2px) contrast(150%) hue-rotate(90deg);
      animation: vhsTracking 8s infinite linear;
      pointer-events: none;
    }

    /* Blinking PLAY text */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .vhs-blink {
      animation: blink 1.2s step-start infinite;
    }

    /* Floating Score Popups */
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-50%, -25px) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
    }
    .floating-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      animation: floatUp 0.8s forwards ease-out;
      text-shadow: 2px 2px 4px #000;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="h-full w-full select-none overflow-hidden bg-black text-white">

  <!-- -->
  <div id="game-container" class="relative w-full h-full overflow-hidden">
    
    <!-- Three.js Canvas with Chromatic Shift -->
    <div class="w-full h-full vhs-rgb-glitch">
      <canvas id="webgl-canvas"></canvas>
    </div>

    <!-- Animated Noise Grain Overlay Canvas -->
    <canvas id="noise-canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-[0.12] z-10 mix-blend-screen"></canvas>

    <!-- Scanline Filter Layer -->
    <div class="absolute inset-0 vhs-scanlines pointer-events-none z-10"></div>

    <!-- Vignette Shadow Layer -->
    <div class="absolute inset-0 vhs-vignette pointer-events-none z-10"></div>

    <!-- VHS Animated Tracking Line -->
    <div class="vhs-tracking-line z-10"></div>

    <!-- HUD (CLEANED OF ALL VCR OSD TEXT & TIMERS) -->
    <div class="absolute top-0 right-0 pointer-events-none z-20 p-6 vhs-font text-white text-2xl md:text-3xl">
      <div class="flex items-center gap-2 text-red-400">
        <span>APPLES:</span>
        <span id="score-text" class="text-white font-bold text-3xl md:text-4xl">000</span>
      </div>
    </div>

    <!-- Crosshair Reticle -->
    <div id="crosshair" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-20 flex items-center justify-center">
      <div id="crosshair-dot" class="w-2.5 h-2.5 bg-yellow-300/90 rounded-full border border-black shadow-md transition-all duration-150"></div>
      <div id="crosshair-ring" class="absolute w-8 h-8 rounded-full border-2 border-emerald-400 scale-50 opacity-0 transition-all duration-150"></div>
    </div>

    <!-- Floating Score Container -->
    <div id="floating-container" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

    <!-- Raycast Harvest Hint -->
    <div id="pick-prompt" class="absolute top-[58%] left-1/2 -translate-x-1/2 z-20 opacity-0 transition-opacity duration-150 pointer-events-none vhs-font">
      <div class="text-yellow-300 text-xl md:text-2xl tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
        [ CLICK OR WALK TO COLLECT ]
      </div>
    </div>

    <!-- MINIMAL NO-BACKGROUND MENU OVERLAY -->
    <div id="start-overlay" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 select-none cursor-pointer z-50 transition-opacity duration-300 vhs-font">
      <h1 class="text-6xl md:text-8xl font-black text-white drop-shadow-[0_4px_12px_rgba(0,0,0,0.95)] mb-4 tracking-wider">
        APPLE COLLECTOR
      </h1>
      <p class="text-2xl md:text-4xl text-yellow-300 drop-shadow-[0_4px_8px_rgba(0,0,0,0.95)] mb-6 tracking-widest">
        CLICK TO START
      </p>
      <p class="text-lg md:text-2xl text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)] tracking-wide">
        WASD TO MOVE &bull; MOUSE TO LOOK &bull; CLICK OR WALK NEAR APPLES TO COLLECT
      </p>
    </div>

  </div>

  <script>
    // Grain Noise Generator
    const noiseCanvas = document.getElementById('noise-canvas');
    const noiseCtx = noiseCanvas.getContext('2d');

    function resizeNoise() {
      noiseCanvas.width = Math.floor(window.innerWidth / 3);
      noiseCanvas.height = Math.floor(window.innerHeight / 3);
    }
    resizeNoise();

    function renderNoise() {
      if (noiseCanvas.width > 0 && noiseCanvas.height > 0) {
        const w = noiseCanvas.width;
        const h = noiseCanvas.height;
        const imgData = noiseCtx.createImageData(w, h);
        const buffer = new Uint32Array(imgData.data.buffer);
        const len = buffer.length;

        for (let i = 0; i < len; i++) {
          if (Math.random() < 0.15) {
            const gray = Math.floor(Math.random() * 255);
            buffer[i] = (255 << 24) | (gray << 16) | (gray << 8) | gray;
          }
        }
        noiseCtx.putImageData(imgData, 0, 0);
      }
      requestAnimationFrame(renderNoise);
    }
    renderNoise();

    // Web Audio Sound Engine
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') { this.ctx.resume(); }
      }
      playPickup() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        const freq = freqs[Math.floor(Math.random() * freqs.length)];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.18);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.22);
      }
    }
    const sound = new SoundEngine();

    // Fallback Canvas Textures
    function createFallbackTexture(type) {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 256;
      const ctx = cvs.getContext('2d');

      if (type === 'grass') {
        ctx.fillStyle = '#3a7d34'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#2d6827';
        for (let i = 0; i < 300; i++) ctx.fillRect(Math.random() * 256, Math.random() * 256, 4, 8);
      } else if (type === 'sky') {
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
      } else if (type === 'bark') {
        ctx.fillStyle = '#5c3a21'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#3d2514';
        for (let i = 0; i < 25; i++) ctx.fillRect(i * 10, 0, 5, 256);
      } else if (type === 'leaves') {
        ctx.fillStyle = '#1e5e22'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#2e8b35';
        for (let i = 0; i < 200; i++) {
          ctx.beginPath(); ctx.arc(Math.random() * 256, Math.random() * 256, 10, 0, Math.PI * 2); ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(cvs);
      if (type === 'grass') {
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(40, 40);
      }
      return tex;
    }

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // Specified Textures
    const urls = {
      grass: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAMOOJRjx_-XuiE643foSNnd1P7rwOXaF1TmzFH9vtkOnuhjBW_5Gj67gb&s=10',
      sky: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHPBSlPjnY4MF8uaT0tyQQvGRfQTeqOUXaRZdF-jZbig&s=10',
      bark: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz6joOtuLfpN1-spaMDE9kckRkavj1n3aedD7fbsjmBg&s=10',
      leaves: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvEsmd9HrBLUS47LtcIVS_8HF6gjLDcVRDDCBgbZY1ww&s=10'
    };

    function loadTexture(url, type, configure) {
      const texture = textureLoader.load(
        url,
        (tex) => { if (configure) configure(tex); },
        undefined,
        () => {
          const fallback = createFallbackTexture(type);
          if (configure) configure(fallback);
          texture.image = fallback.image;
          texture.needsUpdate = true;
        }
      );
      if (configure) configure(texture);
      return texture;
    }

    const grassTex = loadTexture(urls.grass, 'grass', (t) => {
      t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(40, 40);
    });
    const skyTex = loadTexture(urls.sky, 'sky');
    const barkTex = loadTexture(urls.bark, 'bark', (t) => {
      t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(1, 3);
    });
    const leavesTex = loadTexture(urls.leaves, 'leaves', (t) => {
      t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2, 2);
    });

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x9bd0e8, 0.007);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 600);
    camera.rotation.order = 'YXZ'; // Clamp YXZ to prevent gimbal flip

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d5c20, 0.4);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff8ed, 0.9);
    sunLight.position.set(60, 90, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 80;
    sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Sky Dome
    const skyGeo = new THREE.SphereGeometry(400, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide });
    const skyMesh = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyMesh);

    // Ground Plane
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const trees = [];
    const applesList = [];
    const orchardRadius = 110;

    const trunkGeo = new THREE.CylinderGeometry(0.55, 0.75, 4.5, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.9 });
    const foliageMat = new THREE.MeshStandardMaterial({ map: leavesTex, roughness: 0.75 });

    const appleBodyGeo = new THREE.SphereGeometry(0.38, 16, 16);
    appleBodyGeo.scale(1, 0.9, 1);
    const stemGeo = new THREE.CylinderGeometry(0.02, 0.03, 0.2, 6);
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
    const appleMat = new THREE.MeshStandardMaterial({ color: 0xee1111, roughness: 0.2, metalness: 0.1 });

    function createAppleGroup() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(appleBodyGeo, appleMat);
      body.castShadow = true;
      group.add(body);

      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.35;
      group.add(stem);

      return group;
    }

    function createTree(x, z) {
      const treeGroup = new THREE.Group();
      treeGroup.position.set(x, 0, z);

      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 2.25;
      trunk.castShadow = true; trunk.receiveShadow = true;
      treeGroup.add(trunk);

      const canopyGroup = new THREE.Group();
      canopyGroup.position.y = 4.8;

      const clusters = [
        { x: 0, y: 0.4, z: 0, r: 2.2 },
        { x: -0.9, y: -0.2, z: 0.7, r: 1.6 },
        { x: 1.0, y: -0.1, z: -0.5, r: 1.6 },
        { x: 0.5, y: 0.1, z: 0.9, r: 1.5 },
        { x: -0.7, y: 0.2, z: -0.8, r: 1.5 }
      ];

      clusters.forEach((c) => {
        const fGeo = new THREE.SphereGeometry(c.r, 12, 12);
        const foliage = new THREE.Mesh(fGeo, foliageMat);
        foliage.position.set(c.x, c.y, c.z);
        foliage.castShadow = true; foliage.receiveShadow = true;
        canopyGroup.add(foliage);
      });

      treeGroup.add(canopyGroup);
      scene.add(treeGroup);

      const treeData = { x, z, appleSlots: [] };
      const appleCount = Math.floor(Math.random() * 3) + 4;

      for (let i = 0; i < appleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 0.8 + Math.random() * 1.4;
        const ly = 3.2 + Math.random() * 1.8;

        const worldX = x + Math.cos(angle) * dist;
        const worldZ = z + Math.sin(angle) * dist;

        const appleGroup = createAppleGroup();
        appleGroup.position.set(worldX, ly, worldZ);
        scene.add(appleGroup);

        const appleObj = {
          mesh: appleGroup,
          position: appleGroup.position,
          active: true
        };

        appleGroup.children.forEach(child => child.userData.appleObj = appleObj);
        appleGroup.userData.appleObj = appleObj;

        applesList.push(appleObj);
        treeData.appleSlots.push(appleObj);
      }

      trees.push(treeData);
    }

    // Populate Orchard
    let spawnedTrees = 0;
    while (spawnedTrees < 36) {
      const rad = Math.sqrt(Math.random()) * (orchardRadius - 12) + 12;
      const angle = Math.random() * Math.PI * 2;
      const x = Math.cos(angle) * rad;
      const z = Math.sin(angle) * rad;

      let tooClose = false;
      for (let t of trees) {
        if (Math.hypot(x - t.x, z - t.z) < 9.5) { tooClose = true; break; }
      }

      if (!tooClose) {
        createTree(x, z);
        spawnedTrees++;
      }
    }

    const particles = [];
    const particleGeo = new THREE.SphereGeometry(0.09, 8, 8);
    const particleMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });

    function spawnPickParticles(pos) {
      for (let i = 0; i < 14; i++) {
        const p = new THREE.Mesh(particleGeo, particleMat);
        p.position.copy(pos);
        scene.add(p);

        particles.push({
          mesh: p,
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 4.0,
            Math.random() * 3.5 + 1.2,
            (Math.random() - 0.5) * 4.0
          ),
          life: 0.65
        });
      }
    }

    const player = {
      position: new THREE.Vector3(0, 1.8, 0),
      velocity: new THREE.Vector3(),
      moveSpeed: 9.0,
      radius: 0.6
    };

    camera.position.copy(player.position);

    const keys = { w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    // FPS Camera Looking
    const startOverlay = document.getElementById('start-overlay');

    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas && document.pointerLockElement !== document.body) return;

      const sensitivity = 0.0022;
      camera.rotation.y -= e.movementX * sensitivity;
      camera.rotation.x -= e.movementY * sensitivity;

      const maxPitch = Math.PI / 2 - 0.08;
      camera.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, camera.rotation.x));
      camera.rotation.z = 0;
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === canvas || document.pointerLockElement === document.body) {
        startOverlay.style.opacity = '0';
        startOverlay.style.pointerEvents = 'none';
      } else {
        startOverlay.style.opacity = '1';
        startOverlay.style.pointerEvents = 'auto';
      }
    });

    startOverlay.addEventListener('click', () => {
      sound.init();
      canvas.requestPointerLock();
    });

    const raycaster = new THREE.Raycaster();
    const centerPoint = new THREE.Vector2(0, 0);
    let hoveredApple = null;

    const crosshairDot = document.getElementById('crosshair-dot');
    const crosshairRing = document.getElementById('crosshair-ring');
    const pickPrompt = document.getElementById('pick-prompt');

    function checkRaycastHover() {
      raycaster.setFromCamera(centerPoint, camera);
      
      const activeAppleMeshes = [];
      applesList.forEach(a => {
        if (a.active) {
          a.mesh.traverse((child) => { if (child.isMesh) activeAppleMeshes.push(child); });
        }
      });

      const intersects = raycaster.intersectObjects(activeAppleMeshes, false);

      if (intersects.length > 0 && intersects[0].distance <= 30.0) {
        let hitMesh = intersects[0].object;
        let appleObj = hitMesh.userData.appleObj;
        while (!appleObj && hitMesh.parent) {
          hitMesh = hitMesh.parent;
          appleObj = hitMesh.userData.appleObj;
        }

        if (appleObj && appleObj.active) {
          hoveredApple = appleObj;
          crosshairDot.className = "w-3.5 h-3.5 bg-emerald-400 rounded-full border border-black shadow-lg scale-125 transition-all";
          crosshairRing.classList.remove('opacity-0', 'scale-50');
          crosshairRing.classList.add('opacity-100', 'scale-100');
          pickPrompt.style.opacity = '1';
          return;
        }
      }

      hoveredApple = null;
      crosshairDot.className = "w-2.5 h-2.5 bg-yellow-300/90 rounded-full border border-black shadow-md transition-all";
      crosshairRing.classList.add('opacity-0', 'scale-50');
      crosshairRing.classList.remove('opacity-100', 'scale-100');
      pickPrompt.style.opacity = '0';
    }

    let score = 0;
    const scoreText = document.getElementById('score-text');

    function collectApple(appleObj) {
      if (!appleObj || !appleObj.active) return;

      appleObj.active = false;
      appleObj.mesh.visible = false;

      sound.playPickup();
      spawnPickParticles(appleObj.position);

      score++;
      scoreText.innerText = String(score).padStart(3, '0');

      showFloatingPlusOne();

      setTimeout(() => {
        appleObj.active = true;
        appleObj.mesh.visible = true;
        appleObj.mesh.scale.set(0.1, 0.1, 0.1);

        let s = 0.1;
        const growInterval = setInterval(() => {
          s += 0.15;
          if (s >= 1.0) {
            appleObj.mesh.scale.set(1, 1, 1);
            clearInterval(growInterval);
          } else {
            appleObj.mesh.scale.set(s, s, s);
          }
        }, 30);
      }, 3500);
    }

    function showFloatingPlusOne() {
      const el = document.createElement('div');
      el.className = 'floating-popup vhs-font text-yellow-300 text-3xl font-black';
      el.innerText = '+1';
      el.style.left = '50%';
      el.style.top = '46%';
      document.getElementById('floating-container').appendChild(el);

      setTimeout(() => el.remove(), 800);
    }

    window.addEventListener('click', () => {
      if (document.pointerLockElement === canvas || document.pointerLockElement === document.body) {
        if (hoveredApple) {
          collectApple(hoveredApple);
        }
      }
    });

    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const isLocked = (document.pointerLockElement === canvas || document.pointerLockElement === document.body);

      if (isLocked) {
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0; forward.normalize();

        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const moveVector = new THREE.Vector3();
        if (keys.w) moveVector.add(forward);
        if (keys.s) moveVector.sub(forward);
        if (keys.d) moveVector.add(right);
        if (keys.a) moveVector.sub(right);

        if (moveVector.lengthSq() > 0) moveVector.normalize();

        const targetVel = moveVector.multiplyScalar(player.moveSpeed);
        player.velocity.x += (targetVel.x - player.velocity.x) * 14 * dt;
        player.velocity.z += (targetVel.z - player.velocity.z) * 14 * dt;

        player.position.x += player.velocity.x * dt;
        player.position.z += player.velocity.z * dt;

        // Tree collisions
        trees.forEach((t) => {
          const dx = player.position.x - t.x;
          const dz = player.position.z - t.z;
          const dist = Math.hypot(dx, dz);
          if (dist < player.radius + 0.75) {
            const angle = Math.atan2(dz, dx);
            player.position.x = t.x + Math.cos(angle) * (player.radius + 0.75);
            player.position.z = t.z + Math.sin(angle) * (player.radius + 0.75);
          }
        });

        // Outer boundary
        const pDist = Math.hypot(player.position.x, player.position.z);
        if (pDist > orchardRadius) {
          const angle = Math.atan2(player.position.z, player.position.x);
          player.position.x = Math.cos(angle) * orchardRadius;
          player.position.z = Math.sin(angle) * orchardRadius;
        }

        camera.position.set(player.position.x, player.position.y, player.position.z);

        checkRaycastHover();

        // Proximity auto harvest
        applesList.forEach((a) => {
          if (a.active) {
            if (player.position.distanceTo(a.position) <= 2.8) {
              collectApple(a);
            }
          }
        });
      }

      // Update pickup particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.vel.y -= 9.8 * dt;

        if (p.life <= 0 || p.mesh.position.y <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeNoise();
    });

    window.onload = () => {
      animate();
    };
  </script>
</body>
</html>
